name: Сборка

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-2022          # Visual Studio 2022: её же требует сборка xpsbuild.exe в action установщика
    permissions:
      contents: write          # для публикации релиза по тегу
    steps:
      - uses: actions/checkout@v4

      - name: Проверка версии
        id: version
        shell: pwsh
        run: ./tools/check_version.ps1 -Tag "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - name: Сборка
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Тесты
        shell: pwsh
        run: |
          build\Release\inf_editor_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Файлы дистрибутива
        shell: pwsh
        run: |
          New-Item -ItemType Directory build\stage | Out-Null
          Copy-Item build\Release\inf_snapin.dll, inf_editor.msc build\stage\

      # релиз создаётся до сборки установщика: action прикладывает установщик к нему
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "INF Editor ${{ github.ref_name }}" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Установщик
        id: installer
        uses: roosslan/cabxp64_installer@trunk
        with:
          project: installer/inf_editor.xsp
          version: ${{ steps.version.outputs.version }}
          mode: both
          out: dist
          defines: |
            APP_DIST=${{ github.workspace }}\build\stage
          release: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Контрольные суммы
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @('${{ steps.installer.outputs.single }}', '${{ steps.installer.outputs.zip }}') | Where-Object { $_ }
          $sums = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          $sums | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          gh release upload "${{ github.ref_name }}" dist\SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: inf_editor-${{ steps.version.outputs.version }}-x64
          path: |
            ${{ steps.installer.outputs.single }}
            ${{ steps.installer.outputs.zip }}
            build/stage/
